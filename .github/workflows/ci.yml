name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install CLI dependencies
        run: bun install --frozen-lockfile

      - name: Install template dependencies
        run: bun install --frozen-lockfile --cwd template

      - name: Lint
        run: bun run lint

      - name: Format check
        run: bun run check

      - name: Typecheck
        run: bun run typecheck

      - name: Create app
        run: bun src/index.ts "$RUNNER_TEMP/e2e-app" --yes --no-git --name e2e-app --title "E2E App"

      - name: Lint created app
        run: bun run --cwd "$RUNNER_TEMP/e2e-app" lint

      - name: Format check created app
        run: bun run --cwd "$RUNNER_TEMP/e2e-app" check

      - name: Typecheck created app
        run: bun run --cwd "$RUNNER_TEMP/e2e-app" typecheck

      - name: Build created app
        run: bun run --cwd "$RUNNER_TEMP/e2e-app" build
